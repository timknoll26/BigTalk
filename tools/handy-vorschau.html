<!doctype html>
<!-- Entwicklungshilfe: zeigt Big Talk in Handygröße (390×844), auch wenn das
     Browserfenster breiter ist. Aufruf: http://localhost:8000/tools/handy-vorschau.html -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Handy-Vorschau</title>
  <style>
    body { margin: 0; background: #333; display: flex; justify-content: center; padding: 8px; }
    iframe { width: 390px; height: 844px; border: 0; background: #000; }
  </style>
</head>
<body>
  <iframe id="phone" src="../index.html"></iframe>
  <script>
    // Andere Größe testen: handy-vorschau.html?w=375&h=667 (z. B. iPhone SE)
    const p = new URLSearchParams(location.search);
    const f = document.getElementById('phone');
    if (p.get('w')) f.style.width = p.get('w') + 'px';
    if (p.get('h')) f.style.height = p.get('h') + 'px';
  </script>
</body>
</html>
